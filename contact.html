<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Contact Jesse Potter about performances, lessons, band camps, and community projects." />
    <meta name="theme-color" content="#17251f" />
    <title>Contact — Jesse Potter</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <a class="wordmark" href="index.html" aria-label="Jesse Potter home">Jesse Potter</a>
      <nav class="site-menu" id="site-menu" aria-label="Main navigation">
        <a href="index.html">Home</a><a href="biography.html">Biography</a><a href="community.html">Community</a><a href="social.html">Social</a><a aria-current="page" href="contact.html">Contact</a>
      </nav>
    </header>
    <main class="content-page contact-page" id="main">
      <img class="page-background" src="assets/jesse-potter-contact.jpg" alt="Jesse Potter with his guitar in a sunlit forest" />
      <div class="page-shade"></div>
      <div class="content-scroll"><article class="content-card contact-card">
        <h1>Get in touch.</h1>
        <p class="page-intro">For bookings, music lessons, band camps, collaborations, or community projects, send Jesse a note.</p>
        <form
        class="contact-form"
        id="contact-form"
        action="https://formspree.io/f/mljdvvla"
        method="post"
        >
          <label>Name<input name="name" type="text" autocomplete="name" required /></label>
          <label>Email<input name="email" type="email" autocomplete="email" required /></label>
          <label>Subject<input name="subject" type="text" required /></label>
          <label>Message<textarea name="message" rows="3" required></textarea></label>
          <button type="submit">Send message<span aria-hidden="true">→</span></button>
        </form>
        
        <div
          class="form-status"
          id="form-status"
          role="status"
          aria-live="polite"
          hidden
        >  
       </div>
      </article></div>
    </main>
    <script src="contact-form.js"></script>  
  </body>
</html>
